services:
  # PostgreSQL：认证模块数据库
  postgres:
    image: postgres:16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_system
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_system"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-net

  # Redis：验证码、限流、临时认证状态
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: password
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - password
    ports:
      - "6379:6379"
    volumes:
      - rag_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-net

  # MinIO：认证模块文件对象存储
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: rag-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Minio@Auth_2026
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rag_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-net

volumes:
  rag_postgres_data:
  rag_redis_data:
  rag_minio_data:

networks:
  rag-net:
    driver: bridge